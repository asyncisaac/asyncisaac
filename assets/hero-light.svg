<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320">
  <!-- Outer card -->
  <rect x="10" y="10" width="780" height="300" rx="10" fill="#f8fafc"/>
  <rect x="10" y="10" width="780" height="300" rx="10" fill="none" stroke="#cbd5e1" stroke-opacity="0.7" stroke-width="1"/>

  <!-- Terminal top bar -->
  <circle cx="46" cy="40" r="6" fill="#ef4444" fill-opacity="0.75"/>
  <circle cx="68" cy="40" r="6" fill="#f59e0b" fill-opacity="0.75"/>
  <circle cx="90" cy="40" r="6" fill="#10b981" fill-opacity="0.75"/>
  <text font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" letter-spacing="0.14em" fill="#475569" x="400" y="44" text-anchor="middle">~ / asyncisaac / profile</text>
  <text font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" letter-spacing="0.14em" fill="#0891b2" x="730" y="44" text-anchor="end">zsh</text>

  <!-- Prompt line: asyncisaac_ with blinking cursor -->
  <text font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" fill="#475569" x="40" y="96">$</text>
  <text font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" fill="#0891b2" font-size="22" font-weight="600" x="66" y="96">whoami</text>
  <text font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#0f172a" font-size="36" font-weight="700" letter-spacing="-0.01em" x="162" y="136">asyncisaac</text>
  <rect x="376" y="108" width="16" height="30" fill="#0891b2">
    <animate attributeName="opacity" values="1;0;1" dur="1.3s" repeatCount="indefinite"/>
  </rect>

  <!-- Main headline -->
  <text font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" letter-spacing="0.18em" fill="#475569" x="40" y="184" text-anchor="start" text-transform="uppercase">Full-Stack Developer</text>

  <text font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" letter-spacing="-0.02em" x="400" y="226" text-anchor="middle">
    <tspan fill="#0891b2">FROM INTERFACE</tspan>
    <tspan fill="#0f172a"> TO </tspan>
    <tspan fill="#0891b2">INFRASTRUCTURE</tspan>
  </text>

  <text font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" letter-spacing="0.02em" fill="#475569" x="40" y="260" text-anchor="start">building products across the stack — ui · app · api · data · workers</text>

  <!-- Bottom stack flow mini visual -->
  <rect x="40"  y="284" width="100" height="20" rx="4" fill="#e2e8f0" fill-opacity="0.4" stroke="#cbd5e1" stroke-opacity="0.5"/>
  <rect x="156" y="284" width="100" height="20" rx="4" fill="#e2e8f0" fill-opacity="0.4" stroke="#cbd5e1" stroke-opacity="0.5"/>
  <rect x="272" y="284" width="100" height="20" rx="4" fill="#e2e8f0" fill-opacity="0.4" stroke="#cbd5e1" stroke-opacity="0.5"/>
  <rect x="388" y="284" width="100" height="20" rx="4" fill="#e2e8f0" fill-opacity="0.4" stroke="#cbd5e1" stroke-opacity="0.5"/>
  <rect x="504" y="284" width="100" height="20" rx="4" fill="#e2e8f0" fill-opacity="0.4" stroke="#cbd5e1" stroke-opacity="0.5"/>

  <text font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" letter-spacing="0.14em" text-transform="uppercase" fill="#0891b2" x="90"  y="298" text-anchor="middle">UI</text>
  <text font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" letter-spacing="0.14em" text-transform="uppercase" fill="#475569" x="148" y="299" text-anchor="middle">→</text>
  <text font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" letter-spacing="0.14em" text-transform="uppercase" fill="#0891b2" x="206" y="298" text-anchor="middle">APP</text>
  <text font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" letter-spacing="0.14em" text-transform="uppercase" fill="#475569" x="264" y="299" text-anchor="middle">→</text>
  <text font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" letter-spacing="0.14em" text-transform="uppercase" fill="#0891b2" x="322" y="298" text-anchor="middle">API</text>
  <text font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" letter-spacing="0.14em" text-transform="uppercase" fill="#475569" x="380" y="299" text-anchor="middle">→</text>
  <text font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" letter-spacing="0.14em" text-transform="uppercase" fill="#0891b2" x="438" y="298" text-anchor="middle">DATA</text>
  <text font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" letter-spacing="0.14em" text-transform="uppercase" fill="#475569" x="496" y="299" text-anchor="middle">→</text>
  <text font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" letter-spacing="0.14em" text-transform="uppercase" fill="#0891b2" x="554" y="298" text-anchor="middle">WORKERS</text>

  <text font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" letter-spacing="0.14em" text-transform="uppercase" fill="#475569" x="770" y="299" text-anchor="end">UTC-3 · BR · Remote</text>
</svg>
