<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-label="From Interface to Infrastructure — 4 layers">
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#525252"/>
    </marker>
  </defs>

  <!-- 01 INTERFACE -->
  <g>
    <rect x="20" y="10"  width="760" height="110" rx="8" fill="#0a0a0a" stroke="#1f1f1f"/>
    <rect x="20" y="10"  width="5"   height="110" rx="2.5" fill="#22d3ee"/>
    <circle cx="64" cy="38" r="16" fill="#22d3ee"/>
    <text font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" fill="#0a0a0a" x="64" y="43" text-anchor="middle" font-size="14" font-weight="700">01</text>
    <text font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#fafafa" x="96" y="42" font-size="18" font-weight="700" letter-spacing="0.04em">INTERFACE</text>
    <text font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#a3a3a3" x="96" y="64" font-size="13">Websites · Landing Pages · Dashboards · Admin Panels · Product UI</text>

    <!-- Chips -->
    <rect x="96"  y="82" width="92"  height="22" rx="4" fill="#171717" stroke="#262626"/>
    <text font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" fill="#fafafa" x="142" y="97" text-anchor="middle">TypeScript</text>
    <rect x="196" y="82" width="68"  height="22" rx="4" fill="#171717" stroke="#262626"/>
    <text font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" fill="#fafafa" x="230" y="97" text-anchor="middle">React</text>
    <rect x="272" y="82" width="70"  height="22" rx="4" fill="#171717" stroke="#262626"/>
    <text font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" fill="#fafafa" x="307" y="97" text-anchor="middle">Next.js</text>
    <rect x="350" y="82" width="80"  height="22" rx="4" fill="#171717" stroke="#262626"/>
    <text font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" fill="#fafafa" x="390" y="97" text-anchor="middle">Tailwind</text>
  </g>

  <line x1="400" y1="120" x2="400" y2="140" stroke="#262626" stroke-width="1.5" marker-end="url(#arrow-dark)"/>

  <!-- 02 PRODUCT -->
  <g>
    <rect x="20" y="140" width="760" height="110" rx="8" fill="#0a0a0a" stroke="#1f1f1f"/>
    <rect x="20" y="140" width="5"   height="110" rx="2.5" fill="#22d3ee"/>
    <circle cx="64" cy="168" r="16" fill="#22d3ee"/>
    <text font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" fill="#0a0a0a" x="64" y="173" text-anchor="middle" font-size="14" font-weight="700">02</text>
    <text font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#fafafa" x="96" y="172" font-size="18" font-weight="700" letter-spacing="0.04em">PRODUCT</text>
    <text font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#a3a3a3" x="96" y="194" font-size="13">SaaS · Web Apps · Authentication · Authorization · Billing · Admin flows</text>

    <rect x="96"  y="212" width="92"  height="22" rx="4" fill="#171717" stroke="#262626"/>
    <text font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" fill="#fafafa" x="142" y="227" text-anchor="middle">TypeScript</text>
    <rect x="196" y="212" width="70"  height="22" rx="4" fill="#171717" stroke="#262626"/>
    <text font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" fill="#fafafa" x="231" y="227" text-anchor="middle">Next.js</text>
    <rect x="274" y="212" width="110" height="22" rx="4" fill="#171717" stroke="#262626"/>
    <text font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" fill="#fafafa" x="329" y="227" text-anchor="middle">PostgreSQL</text>
    <rect x="392" y="212" width="88"  height="22" rx="4" fill="#171717" stroke="#262626"/>
    <text font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" fill="#fafafa" x="436" y="227" text-anchor="middle">Prisma</text>
    <rect x="488" y="212" width="62"  height="22" rx="4" fill="#171717" stroke="#262626"/>
    <text font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" fill="#fafafa" x="519" y="227" text-anchor="middle">JWT</text>
  </g>

  <line x1="400" y1="250" x2="400" y2="270" stroke="#262626" stroke-width="1.5" marker-end="url(#arrow-dark)"/>

  <!-- 03 BACKEND -->
  <g>
    <rect x="20" y="270" width="760" height="110" rx="8" fill="#0a0a0a" stroke="#1f1f1f"/>
    <rect x="20" y="270" width="5"   height="110" rx="2.5" fill="#22d3ee"/>
    <circle cx="64" cy="298" r="16" fill="#22d3ee"/>
    <text font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" fill="#0a0a0a" x="64" y="303" text-anchor="middle" font-size="14" font-weight="700">03</text>
    <text font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#fafafa" x="96" y="302" font-size="18" font-weight="700" letter-spacing="0.04em">BACKEND</text>
    <text font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#a3a3a3" x="96" y="324" font-size="13">REST APIs · Payments · Webhooks · Business Logic · Integrations · RBAC</text>

    <rect x="96"  y="342" width="80"  height="22" rx="4" fill="#171717" stroke="#262626"/>
    <text font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" fill="#fafafa" x="136" y="357" text-anchor="middle">Node.js</text>
    <rect x="184" y="342" width="78"  height="22" rx="4" fill="#171717" stroke="#262626"/>
    <text font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" fill="#fafafa" x="223" y="357" text-anchor="middle">Express</text>
    <rect x="270" y="342" width="68"  height="22" rx="4" fill="#171717" stroke="#262626"/>
    <text font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" fill="#fafafa" x="304" y="357" text-anchor="middle">Stripe</text>
    <rect x="346" y="342" width="88"  height="22" rx="4" fill="#171717" stroke="#262626"/>
    <text font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" fill="#fafafa" x="390" y="357" text-anchor="middle">Prisma</text>
    <rect x="442" y="342" width="110" height="22" rx="4" fill="#171717" stroke="#262626"/>
    <text font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" fill="#fafafa" x="497" y="357" text-anchor="middle">PostgreSQL</text>
  </g>

  <line x1="400" y1="380" x2="400" y2="400" stroke="#262626" stroke-width="1.5" marker-end="url(#arrow-dark)"/>

  <!-- 04 RELIABILITY (differential) -->
  <g>
    <rect x="20" y="400" width="760" height="110" rx="8" fill="#0a0a0a" stroke="#1f1f1f"/>
    <rect x="20" y="400" width="5"   height="110" rx="2.5" fill="#22d3ee"/>
    <circle cx="64" cy="428" r="16" fill="#22d3ee"/>
    <text font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" fill="#0a0a0a" x="64" y="433" text-anchor="middle" font-size="14" font-weight="700">04</text>
    <text font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#22d3ee" x="96" y="432" font-size="18" font-weight="700" letter-spacing="0.04em">RELIABILITY <tspan fill="#737373" font-size="11" font-weight="500">← technical differential</tspan></text>
    <text font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#a3a3a3" x="96" y="454" font-size="13">Queues · Retries · Idempotency · Concurrency · Dead-letter · Data consistency · Observability</text>

    <rect x="96"  y="472" width="74"  height="22" rx="4" fill="#171717" stroke="#262626"/>
    <text font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" fill="#fafafa" x="133" y="487" text-anchor="middle">Redis</text>
    <rect x="178" y="472" width="80"  height="22" rx="4" fill="#171717" stroke="#262626"/>
    <text font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" fill="#fafafa" x="218" y="487" text-anchor="middle">BullMQ</text>
    <rect x="266" y="472" width="110" height="22" rx="4" fill="#171717" stroke="#262626"/>
    <text font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" fill="#fafafa" x="321" y="487" text-anchor="middle">PostgreSQL</text>
    <rect x="384" y="472" width="120" height="22" rx="4" fill="#171717" stroke="#262626"/>
    <text font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" fill="#fafafa" x="444" y="487" text-anchor="middle">Prometheus</text>
    <rect x="512" y="472" width="90"  height="22" rx="4" fill="#171717" stroke="#262626"/>
    <text font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" fill="#fafafa" x="557" y="487" text-anchor="middle">Docker</text>
  </g>
</svg>
